name: Validate site

on:
  pull_request:
    paths:
      - 'MANIFESTO.md'
      - 'site/**'
      - 'signatories/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt
      - run: node site/scripts/validate-signatories.mjs
      - run: python site/scripts/build.py

name: Validate site

on:
  pull_request:
    paths:
      - 'MANIFESTO.md'
      - 'site/**'
      - 'signatories/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/scripts/validate-signatories.mjs
      - run: node site/scripts/build.mjs

name: Validate signatures

on:
  pull_request:
    paths:
      - 'signatories/**'
      - 'scripts/validate-signatories.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-signatories.mjs
